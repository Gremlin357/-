<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Шелес | 3D модель поселка</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app">
      <section class="viewport">
        <div id="scene"></div>
        <img class="logo-overlay" src="./лого.svg" alt="Шелес" />
        <div class="logo-controls">
          <button id="first-queue" class="queue-button">Первая очередь</button>
          <button id="second-queue" class="queue-button">Вторая очередь</button>
          <button id="third-queue" class="queue-button">Третья очередь</button>
        </div>
        <div class="toolbar">
          <button id="reset-camera" title="Вернуть камеру" aria-label="Вернуть камеру">
            <img src="./reload.svg" alt="" />
          </button>
        </div>
      </section>
    </main>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
